# ─── Réparation du secret GitHub DATABASE_URL (Neon → GitHub) ────────────────
#
# Contexte (incident du 25-26/11/2026) : les rotations Neon de ces deux jours
# ont tourné sur l'ANCIEN projet (green-moon-61901921) au lieu du projet de
# production (spring-mud-40589280). Résultat :
#   • le secret GitHub DATABASE_URL porte le mot de passe d'un AUTRE projet
#     (rejeté : « password authentication failed ») ;
#   • l'URI active de Vercel, posée avant l'incident, reste VALIDE — l'app
#     fonctionne (healthcheck 200 avec SELECT 1).
# `sync-database-url.yml` ne peut pas réparer depuis Vercel : les variables
# « sensitive » de Vercel ne sont plus déchiffrables via l'API (valeur=null).
#
# Ce workflow reconstruit donc le secret depuis la SOURCE DE VÉRITÉ Neon :
#   1. GET projet spring-mud-40589280 → branche par défaut → base + rôle ;
#   2. endpoint direct (sans -pooler) + reveal-password (NEON_API_KEY) ;
#   3. VÉRIFICATION réelle : psql « SELECT 1 » sur l'URI reconstruite
#      (échec = abort, RIEN n'est écrit) ;
#   4. écriture du secret GitHub DATABASE_URL (GH_SECRETS_WRITER).
# AUCUNE rotation, AUCUNE modification côté Vercel : l'app n'est pas touchée.
#
# Le mot de passe n'est jamais affiché (add-mask + psql silencieux) ; le
# fichier temporaire est détruit (shred).
#
# Secrets requis : NEON_API_KEY, GH_SECRETS_WRITER (PAT écriture secrets).
# Lancer : GitHub → Actions → « Réparation secret DATABASE_URL » → Run workflow
# (confirmer = OUI), PUIS relancer « Migration base de données ».
# ─────────────────────────────────────────────────────────────────────────────

name: Réparation secret DATABASE_URL (Neon → GitHub)

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Taper OUI pour reconstruire le secret depuis l'API Neon (aucune rotation, Vercel intact)"
        type: string
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: repare-secret-db
  cancel-in-progress: false

jobs:
  repare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: spring-mud-40589280
      GH_TOKEN: ${{ secrets.GH_SECRETS_WRITER }}
      REPO: RTsimbina/Suivi-Sante
    steps:
      - uses: actions/checkout@v4

      - name: Contrôle de confirmation
        run: |
          if [ "${{ inputs.confirmer }}" != "OUI" ]; then
            echo "::error::Confirmation absente — tapez OUI dans l'input « confirmer »."
            exit 1
          fi

      - name: Installer le client PostgreSQL
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          psql --version

      - name: Reconstruire l'URI directe depuis l'API Neon (mot de passe masqué)
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2"
          AUTH="Authorization: Bearer ${NEON_API_KEY}"

          PROJET=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' "$API/projects/${NEON_PROJECT_ID}")
          CODE_PROJET=$(echo "$PROJET" | tail -n1)
          if [ "$CODE_PROJET" != "200" ]; then
            echo "::error::API Neon /projects/${NEON_PROJECT_ID} → HTTP $CODE_PROJET."
            exit 1
          fi
          BRANCH_ID=$(echo "$PROJET" | head -n -1 | jq -r '.project.default_branch_id // ""')
          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            BRANCH_ID=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
              -H "$AUTH" -H "Accept: application/json" \
              "$API/projects/$NEON_PROJECT_ID/branches" \
              | jq -r '[.branches[] | select(.primary == true)][0].id // .branches[0].id')
          fi
          echo "Projet Neon : $NEON_PROJECT_ID / branche : $BRANCH_ID"

          BASES=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' "$API/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/databases")
          CODE_BASES=$(echo "$BASES" | tail -n1)
          if [ "$CODE_BASES" != "200" ]; then
            echo "::error::API Neon /databases → HTTP $CODE_BASES."
            exit 1
          fi
          BASE=$(echo "$BASES" | head -n -1 | jq -r '.databases[0].name')
          ROLE=$(echo "$BASES" | head -n -1 | jq -r '.databases[0].owner_name')
          echo "Base : $BASE (rôle : $ROLE)"

          ENDPOINTS=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            "$API/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/endpoints")
          HOST=$(echo "$ENDPOINTS" | jq -r '[.endpoints[] | select(.host | contains("pooler") | not)][0].host // .endpoints[0].host // ""')
          if [ -z "$HOST" ]; then
            echo "::error::Aucun endpoint Neon trouvé sur la branche $BRANCH_ID."
            exit 1
          fi
          echo "Endpoint direct : ${HOST%%.*} (host complet masqué avec l'URI)."

          MDP_REPONSE=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' \
            "$API/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/roles/${ROLE}/reveal-password")
          CODE_MDP=$(echo "$MDP_REPONSE" | tail -n1)
          if [ "$CODE_MDP" != "200" ]; then
            echo "::error::reveal-password → HTTP $CODE_MDP (clé sans droit « reveal password » ?)."
            exit 1
          fi
          MDP=$(echo "$MDP_REPONSE" | head -n -1 | jq -r '.password')
          if [ -z "$MDP" ] || [ "$MDP" = "null" ]; then
            echo "::error::Le mot de passe du rôle ${ROLE} n'a pas été renvoyé."
            exit 1
          fi
          echo "::add-mask::$MDP"
          URI="postgresql://${ROLE}:${MDP}@${HOST}/${BASE}?sslmode=require"
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Vérifier la connexion réelle (SELECT 1) avant toute écriture
        run: |
          set -euo pipefail
          RESULTAT=$(psql "$DATABASE_URL" -tAc "SELECT 'connexion OK — ' || current_database() || ' / ' || current_user")
          echo "$RESULTAT"

      - name: Écrire le secret GitHub DATABASE_URL
        run: |
          set -euo pipefail
          printf '%s' "$DATABASE_URL" > /tmp/uri_direct.txt
          gh secret set DATABASE_URL --repo "$REPO" --body "$(cat /tmp/uri_direct.txt)"
          shred -u /tmp/uri_direct.txt 2>/dev/null || rm -f /tmp/uri_direct.txt
          echo "Secret DATABASE_URL réécrit (valeur masquée, jamais affichée)."

      - name: Vérifier la fraîcheur du secret
        run: gh secret list --repo "$REPO" | sed -n 's/^\(DATABASE_URL\).*/\1 — mis à jour/p'

      - name: Synthèse
        run: |
          echo "Le secret GitHub DATABASE_URL est désormais aligné sur le projet Neon"
          echo "de production ($NEON_PROJECT_ID), vérifié par SELECT 1 réel."
          echo "Étape suivante : lancer « Migration base de données » avec"
          echo "adopter_existant=true (les 13 migrations post-16/09 seront appliquées)."
