# ─── Vérification post-migration (one-shot, suppression prévue) ──────────────
# Contrôle que les colonnes du module Prestataires existent bien en production.

name: Vérification schéma production

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Récupérer l'URL (identique à migrate.yml)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          URI="$DATABASE_URL"
          URI=$(echo "$URI" | sed 's/-pooler\././')
          URI=$(echo "$URI" | sed 's/channel_binding=require//; s/&channel_binding=require//')
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Colonnes Prestataire / HistoriqueParametre + état migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm ci --silent
          npx prisma migrate status
          node --input-type=module -e "
          import { PrismaClient } from '@prisma/client';
          const db = new PrismaClient();
          const cols = await db.\$queryRawUnsafe(
            \"SELECT table_name, column_name, data_type FROM information_schema.columns WHERE (table_name='Prestataire' AND column_name IN ('stat','statutJuridique')) OR (table_name='HistoriqueParametre' AND column_name='roleUtilisateur') ORDER BY table_name, column_name\"
          );
          console.log('=== Colonnes attendues en production ===');
          console.table(cols);
          const nbPresta = await db.prestataire.count();
          console.log('Prestataires en base :', nbPresta);
          const nbJournal = await db.historiqueParametre.count();
          console.log('Traces de journal en base :', nbJournal);
          await db.\$disconnect();
          " 2>&1 | head -40
