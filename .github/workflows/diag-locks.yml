# ─── Diagnostic verrou consultatif Prisma (one-shot, suppression prévue) ─────
# Identifie le détenteur de pg_advisory_lock(72707369) utilisé par migrate
# deploy (P1002 « Timed out trying to acquire a postgres advisory lock »).

name: Diagnostic verrous DB

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Récupérer l'URL (identique à migrate.yml)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          URI="$DATABASE_URL"
          URI=$(echo "$URI" | sed 's/-pooler\././')
          URI=$(echo "$URI" | sed 's/channel_binding=require//; s/&channel_binding=require//')
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"

      - name: Sessions actives + détenteur du verrou consultatif
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm ci --silent
          node --input-type=module -e "
          import { PrismaClient } from '@prisma/client';
          const db = new PrismaClient();
          const verrous = await db.\$queryRawUnsafe(
            \"SELECT pid, objid, granted, mode FROM pg_locks WHERE locktype='advisory'\"
          );
          console.log('=== Verrous consultatifs (objid 72707369 = verrou Prisma migrate) ===');
          console.table(verrous.map(v => ({...v, objid: Number(v.objid)})));
          const sessions = await db.\$queryRawUnsafe(
            \"SELECT pid, usename, application_name, client_addr, state, backend_start, xact_start, state_change, left(query, 90) AS query FROM pg_stat_activity WHERE pid <> pg_backend_pid() AND datname = current_database() ORDER BY backend_start\"
          );
          console.log('=== Sessions actives (production) ===');
          console.table(sessions.map(s => ({...s, query: s.query?.replace(/\n/g,' ')})));
          await db.\$disconnect();
          " 2>&1 | head -90
