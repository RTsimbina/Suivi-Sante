# ─── Migration base de données (Neon → Prisma) ───────────────────────────────
#
# Chemin AUTORITAIRE et DEPUIS 2026-11 EXCLUSIF pour appliquer les migrations
# Prisma sur la base de production : `prisma migrate deploy` a été RETIRÉ du
# script build de Vercel (package.json) — le build ne fait plus que compiler
# Next.js, et CE workflow est le seul chemin de migration de production.
#
# Contexte (incident du 16/09/2026) : la base production a été créée et
# maintenue avec `prisma db push` (aucune table _prisma_migrations). Le
# `prisma migrate deploy` du build Vercel a donc tenté de recréer des tables
# existantes (« relation already exists ») → build en échec → ancien code
# servi, migration jamais appliquée, listes « aucune liste trouvée ».
#
# SAUVEGARDE AVANT MIGRATION (input sauvegarde, défaut : true) :
#   un pg_dump VÉRIFIÉ (lisibilité + taille non nulle, scripts/backup-db.sh)
#   est produit AVANT toute application de migration et publié en artifact
#   GitHub privé (rétention 7 jours). Restauration : scripts/restore-db.sh
#   (pg_restore) sur l'URL de connexion directe.
#
# DÉPLOIEMENT APPLICATIF (input declencher_deploiement, défaut : false) :
#   Vercel déploie automatiquement à chaque push git ; pour garantir que le
#   nouveau code part APRÈS les migrations nécessaires, cocher
#   declencher_deploiement : un Deploy Hook Vercel (secret optionnel
#   VERCEL_DEPLOY_HOOK_URL) déclenche le déploiement UNE FOIS les migrations
#   réussies et vérifiées. Les migrations du projet sont additives et non
#   destructives : le code reste compatible avant ET après leur application.
#
# Deux modes (workflow_dispatch) :
#   • adopter_existant = true  (PREMIÈRE exécution) : enregistre les
#     migrations ANTÉRIEURES au couper 20260916120000 comme « appliquées »
#     (déjà matérialisées par db push jusqu'à l'incident du 16/09) et laisse
#     TOUTES celles à partir de ce couper en attente (13 migrations : KPI
#     collaborateurs, révocation de session, index…) — elles sont réellement
#     appliquées par `migrate deploy` dans le même run. Puis `migrate status`.
#   • adopter_existant = false (exécutions suivantes) : `migrate deploy`
#     standard — n'applique que les migrations en attente, idempotent.
#   • resoudre_echec = <nom de migration> (RÉCUPÉRATION P3018) : marque la
#     migration indiquée comme « rolled-back » (prisma migrate resolve
#     --rolled-back) AVANT le deploy, afin qu'elle puisse être rejouée.
#     À utiliser quand un build Vercel a échoué en pleine migration
#     (ex : erreur SQL) — corriger d'abord le SQL de la migration.
#   • liberer_verrou = true (RÉCUPÉRATION P1002) : termine les sessions
#     détenant encore le verrou consultatif prisma migrate
#     (pg_advisory_lock(72707369)) — typiquement une session pgbouncer
#     idle laissée par un build Vercel interrompu (incident du 16/09 et
#     du 24/09). Sans cela, migrate échoue en P1002 (timeout du verrou).
#
# Secret requis : NEON_API_KEY (déjà configuré). L'URL de connexion est
# récupérée via l'API Neon (connexion DIRECTE, sans -pooler, requis pour
# les migrations — cf. docs/procedure-deploiement.md) et masquée dans les
# logs ; elle n'est jamais affichée.
#
# Lancer : GitHub → Actions → « Migration base de données » → Run workflow.
# (Ou via API : POST /repos/RTsimbina/Suivi-Sante/actions/workflows/migrate.yml/dispatches)

name: Migration base de données

on:
  workflow_dispatch:
    inputs:
      adopter_existant:
        description: "Première exécution : base créée via db push ? (adopte la chaîne de migrations)"
        type: boolean
        default: false
        required: false
      resoudre_echec:
        description: "Récupération P3018 : nom de la migration en échec à remettre « rolled-back » (vide sinon)"
        type: string
        default: ""
        required: false
      liberer_verrou:
        description: "Récupération P1002 : terminer les sessions détenant le verrou consultatif migrate"
        type: boolean
        default: false
        required: false
      sauvegarde:
        description: "Sauvegarde pg_dump VÉRIFIÉE avant migration (recommandé : true)"
        type: boolean
        default: true
        required: false
      declencher_deploiement:
        description: "Déclencher le déploiement Vercel APRÈS migrations réussies (secret VERCEL_DEPLOY_HOOK_URL requis)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer l'URL de connexion directe depuis l'API Neon
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # SI LE SECRET DATABASE_URL EST DÉFINI → il est utilisé directement
          # (mot de passe non récupérable via l'API Neon, route supprimée).
          # Sinon, fallback : construction via l'API Neon (host + rôle ; le
          # mot de passe manque alors → erreur explicite).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_PROJECT_ID: spring-mud-40589280
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Secret DATABASE_URL détecté — utilisation directe (masquée)."
            URI="$DATABASE_URL"
            # Connexion DIRECTE requise pour les migrations (Neon : jamais -pooler)
            URI=$(echo "$URI" | sed 's/-pooler\././')
            echo "::add-mask::$URI"
            echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"
            exit 0
          fi
          API="https://console.neon.tech/api/v2"
          AUTH="Authorization: Bearer ${NEON_API_KEY}"

          # Projet ciblé (clé scopée) — GET /projects/{id}
          PROJET=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' "$API/projects/${NEON_PROJECT_ID}")
          CODE_PROJET=$(echo "$PROJET" | tail -n1)
          if [ "$CODE_PROJET" != "200" ]; then
            echo "::error::API Neon /projects/${NEON_PROJECT_ID} → HTTP $CODE_PROJET. Réponse :"
            echo "$PROJET" | head -n -1 | head -c 500
            echo ""
            exit 1
          fi
          PROJECT_ID=$(echo "$PROJET" | head -n -1 | jq -r '.project.id')
          BRANCH_ID=$(echo "$PROJET" | head -n -1 | jq -r '.project.default_branch_id // ""')
          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            # Repli : branche primaire via GET /branches
            BRANCH_ID=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
              -H "$AUTH" -H "Accept: application/json" \
              "$API/projects/$PROJECT_ID/branches" \
              | jq -r '[.branches[] | select(.primary == true)][0].id // .branches[0].id')
          fi
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::error::Projet Neon ${NEON_PROJECT_ID} inaccessible avec NEON_API_KEY."
            exit 1
          fi
          echo "Projet Neon : $PROJECT_ID / branche : $BRANCH_ID"

          # Base + rôle propriétaire de la branche (par défaut : la première)
          BASES=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/databases")
          CODE_BASES=$(echo "$BASES" | tail -n1)
          if [ "$CODE_BASES" != "200" ]; then
            echo "::error::API Neon /databases → HTTP $CODE_BASES. Réponse :"
            echo "$BASES" | head -n -1 | head -c 500
            echo ""
            exit 1
          fi
          BASE=$(echo "$BASES" | head -n -1 | jq -r '.databases[0].name')
          ROLE=$(echo "$BASES" | head -n -1 | jq -r '.databases[0].owner_name')
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            echo "::error::Aucune base trouvée sur la branche $BRANCH_ID."
            exit 1
          fi
          echo "Base : $BASE (rôle : $ROLE)"

          # URI de connexion — connexion DIRECTE requise pour les migrations.
          # L'ancien endpoint /connection_uri n'existe plus (« this route does
          # not exist ») : on construit l'URI depuis l'endpoint direct de la
          # branche + le mot de passe du rôle (API reveal-password).
          ENDPOINTS=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/endpoints")
          HOST=$(echo "$ENDPOINTS" | jq -r '[.endpoints[] | select(.host | contains("pooler") | not)][0].host // .endpoints[0].host // ""')
          if [ -z "$HOST" ]; then
            echo "::error::Aucun endpoint Neon trouvé sur la branche $BRANCH_ID."
            exit 1
          fi
          MDP_REPONSE=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' \
            "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/roles/${ROLE}/reveal_password")
          CODE_MDP=$(echo "$MDP_REPONSE" | tail -n1)
          if [ "$CODE_MDP" != "200" ]; then
            echo "::error::reveal-password → HTTP $CODE_MDP. Réponse :"
            echo "$MDP_REPONSE" | head -n -1 | head -c 300
            echo ""
            echo "::error::Si la clé n'a pas le droit « reveal password », ajoutez un secret GitHub DATABASE_URL (postgresql://…/neondb?sslmode=require) et remplacez l'étape « Récupérer l'URL » par : DATABASE_URL=${DATABASE_URL:-}."
            exit 1
          fi
          MDP=$(echo "$MDP_REPONSE" | head -n -1 | jq -r '.password')
          if [ -z "$MDP" ] || [ "$MDP" = "null" ]; then
            echo "::error::Le mot de passe du rôle ${ROLE} n'a pas été renvoyé."
            exit 1
          fi
          echo "::add-mask::$MDP"
          URI="postgresql://${ROLE}:${MDP}@${HOST}/${BASE}?sslmode=require"
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"
          echo "URL de connexion construite et masquée (connexion directe, host : ${HOST})."

      - name: Adoption de la chaîne (première exécution, base db push)
        if: ${{ inputs.adopter_existant == true }}
        env:
          # Couper temporel : les migrations ANTÉRIEURES à ce timestamp ont été
          # matérialisées par `db push` (historique jusqu'à l'incident du
          # 16/09/2026) ; celles À PARTIR de ce timestamp n'ont JAMAIS été
          # exécutées sur la base (pas plus par db push, retiré du build, que
          # par migrate) → elles restent EN ATTENTE et sont réellement
          # appliquées par `migrate deploy` ci-dessous.
          # Correction du 27/11/2026 : l'ancienne logique marquait « appliquées »
          # toutes les migrations sauf la plus récente — elle aurait donc
          # ré-enregistré sans les exécuter les 12 migrations postérieures au
          # couper (KPI collaborateurs/EtapeTraitement, révocation de session,
          # index…), laissant la base incomplète (P2022/P2021 en production).
          COUPER_ADOPTION: "20260916120000"
        run: |
          set -euo pipefail
          for d in prisma/migrations/*/ ; do
            M=$(basename "$d")
            [ "$M" = "migration_lock.toml" ] && continue
            TS=${M%%_*}
            if [ "$TS" -ge "$COUPER_ADOPTION" ] 2>/dev/null; then
              echo "→ $M : laissée EN ATTENTE (sera réellement appliquée par migrate deploy)."
              continue
            fi
            echo "→ $M : enregistrement comme déjà appliquée (matérialisée par db push)."
            npx prisma migrate resolve --applied "$M" 2>&1 | grep -v '^$' || \
              echo "   (déjà enregistrée — ignoré)"
          done

      - name: Libération du verrou consultatif Prisma (mode récupération P1002)
        if: ${{ inputs.liberer_verrou == true }}
        run: |
          npx prisma generate >/dev/null 2>&1 || true
          node scripts/liberer-verrou-migrate.mjs

      - name: Résolution d'une migration en échec (rollback logique, mode récupération)
        if: ${{ inputs.resoudre_echec != '' }}
        run: npx prisma migrate resolve --rolled-back "${{ inputs.resoudre_echec }}"

      - name: Sauvegarde de la base (pg_dump VÉRIFIÉ, avant toute migration)
        if: ${{ inputs.sauvegarde != false }}
        env:
          BACKUP_DIR: backups
        run: |
          set -euo pipefail
          # DATABASE_URL (connexion directe, masquée) est exporté par
          # l'étape « Récupérer l'URL » ci-dessus via GITHUB_ENV.
          # backup-db.sh vérifie la lisibilité et la taille non nulle du dump.
          bash scripts/backup-db.sh
          ls -lh backups/

      - name: Publier la sauvegarde pré-migration (artifact privé, 7 jours)
        if: ${{ inputs.sauvegarde != false }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-pre-migration-${{ github.run_id }}
          path: backups/
          retention-days: 7
          if-no-files-found: error

      - name: Appliquer les migrations en attente
        run: npx prisma migrate deploy

      - name: État final des migrations
        run: npx prisma migrate status

      - name: Vérification stricte — aucune migration en attente ni en échec
        run: |
          set -euo pipefail
          ETAT=$(npx prisma migrate status 2>&1)
          echo "$ETAT"
          # Échec EXPLICITE si la base n'est pas à jour : une migration
          # restée en attente ou en échec ne doit jamais passer inaperçue.
          if echo "$ETAT" | grep -qi "not yet been applied\|have failed"; then
            echo "::error::Des migrations restent en attente ou en échec — voir la sortie ci-dessus."
            exit 1
          fi

      - name: Déclencher le déploiement applicatif (hook Vercel, migrations vérifiées)
        if: ${{ inputs.declencher_deploiement == true }}
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::declencher_deploiement=true mais le secret VERCEL_DEPLOY_HOOK_URL n'est pas défini. Créer un Deploy Hook dans Vercel (Project Settings → Git → Deploy Hooks) puis l'ajouter aux secrets du dépôt."
            exit 1
          fi
          # L'URL du hook n'est jamais affichée (secret GitHub, masqué).
          for i in 1 2 3; do
            if curl -sS --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null; then
              echo "Déploiement Vercel déclenché après migrations réussies et vérifiées."
              exit 0
            fi
            echo "Tentative $i échouée, nouvel essai dans 5 s…"
            sleep 5
          done
          echo "::error::Impossible de déclencher le déploiement Vercel après 3 tentatives."
          exit 1

      - name: Synthèse
        if: always()
        run: |
          echo "Rappel :"
          echo "• Première exécution → cocher « adopter_existant »."
          echo "• Exécutions suivantes → laisser décoché (deploy standard)."
          echo "• Migration en échec (P3018) → renseigner « resoudre_echec » avec le nom de la migration."
          echo "• Verrou migrate indisponible (P1002) → cocher « liberer_verrou »."
          echo "• Sauvegarde pg_dump avant migration → coché par défaut ; artifact"
          echo "  « backup-pre-migration-<run> » téléchargeable 7 jours (restore-db.sh)."
          echo "• Le build Vercel ne migre PLUS : ce workflow est le SEUL chemin de"
          echo "  migration de production."
          echo "• Pour déployer le code APRÈS migrations → cocher « declencher_deploiement »"
          echo "  (secret VERCEL_DEPLOY_HOOK_URL requis — Deploy Hook Vercel)."
          echo "• Une fois ce workflow vert, recharger l'application : les listes"
          echo "  Prestataires / Sociétés / Service Technique / Utilisateurs fonctionnent."
