# ─── Migration base de données (Neon → Prisma) ───────────────────────────────
#
# Chemin AUTORITAIRE pour appliquer les migrations Prisma sur la base de
# production, indépendamment du build Vercel.
#
# Contexte (incident du 16/09/2026) : la base production a été créée et
# maintenue avec `prisma db push` (aucune table _prisma_migrations). Le
# `prisma migrate deploy` du build Vercel a donc tenté de recréer des tables
# existantes (« relation already exists ») → build en échec → ancien code
# servi, migration jamais appliquée, listes « aucune liste trouvée ».
#
# Deux modes (workflow_dispatch) :
#   • adopter_existant = true  (PREMIÈRE exécution) : enregistre les
#     migrations DÉJÀ matérialisées dans la base (via db push) comme
#     « appliquées » (migrate resolve --applied), SAUF la plus récente
#     (20260916120000_email_contact_principal) qui est, elle, réellement
#     appliquée par migrate deploy. Puis `prisma migrate status`.
#   • adopter_existant = false (exécutions suivantes) : `migrate deploy`
#     standard — n'applique que les migrations en attente, idempotent.
#
# Secret requis : NEON_API_KEY (déjà configuré). L'URL de connexion est
# récupérée via l'API Neon (connexion DIRECTE, sans -pooler, requis pour
# les migrations — cf. docs/procedure-deploiement.md) et masquée dans les
# logs ; elle n'est jamais affichée.
#
# Lancer : GitHub → Actions → « Migration base de données » → Run workflow.
# (Ou via API : POST /repos/RTsimbina/Suivi-Sante/actions/workflows/migrate.yml/dispatches)

name: Migration base de données

on:
  workflow_dispatch:
    inputs:
      adopter_existant:
        description: "Première exécution : base créée via db push ? (adopte la chaîne de migrations)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer l'URL de connexion directe depuis l'API Neon
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # SI LE SECRET DATABASE_URL EST DÉFINI → il est utilisé directement
          # (mot de passe non récupérable via l'API Neon, route supprimée).
          # Sinon, fallback : construction via l'API Neon (host + rôle ; le
          # mot de passe manque alors → erreur explicite).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_PROJECT_ID: green-moon-61901921
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Secret DATABASE_URL détecté — utilisation directe (masquée)."
            URI="$DATABASE_URL"
            # Connexion DIRECTE requise pour les migrations (Neon : jamais -pooler)
            URI=$(echo "$URI" | sed 's/-pooler\././')
            echo "::add-mask::$URI"
            echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"
            exit 0
          fi
          API="https://console.neon.tech/api/v2"
          AUTH="Authorization: Bearer ${NEON_API_KEY}"

          # Projet ciblé (clé scopée) — GET /projects/{id}
          PROJET=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' "$API/projects/${NEON_PROJECT_ID}")
          CODE_PROJET=$(echo "$PROJET" | tail -n1)
          if [ "$CODE_PROJET" != "200" ]; then
            echo "::error::API Neon /projects/${NEON_PROJECT_ID} → HTTP $CODE_PROJET. Réponse :"
            echo "$PROJET" | head -n -1 | head -c 500
            echo ""
            exit 1
          fi
          PROJECT_ID=$(echo "$PROJET" | head -n -1 | jq -r '.project.id')
          BRANCH_ID=$(echo "$PROJET" | head -n -1 | jq -r '.project.default_branch_id // ""')
          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            # Repli : branche primaire via GET /branches
            BRANCH_ID=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
              -H "$AUTH" -H "Accept: application/json" \
              "$API/projects/$PROJECT_ID/branches" \
              | jq -r '[.branches[] | select(.primary == true)][0].id // .branches[0].id')
          fi
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::error::Projet Neon ${NEON_PROJECT_ID} inaccessible avec NEON_API_KEY."
            exit 1
          fi
          echo "Projet Neon : $PROJECT_ID / branche : $BRANCH_ID"

          # Base + rôle propriétaire de la branche (par défaut : la première)
          BASES=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/databases")
          CODE_BASES=$(echo "$BASES" | tail -n1)
          if [ "$CODE_BASES" != "200" ]; then
            echo "::error::API Neon /databases → HTTP $CODE_BASES. Réponse :"
            echo "$BASES" | head -n -1 | head -c 500
            echo ""
            exit 1
          fi
          BASE=$(echo "$BASES" | head -n -1 | jq -r '.databases[0].name')
          ROLE=$(echo "$BASES" | head -n -1 | jq -r '.databases[0].owner_name')
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            echo "::error::Aucune base trouvée sur la branche $BRANCH_ID."
            exit 1
          fi
          echo "Base : $BASE (rôle : $ROLE)"

          # URI de connexion — connexion DIRECTE requise pour les migrations.
          # L'ancien endpoint /connection_uri n'existe plus (« this route does
          # not exist ») : on construit l'URI depuis l'endpoint direct de la
          # branche + le mot de passe du rôle (API reveal-password).
          ENDPOINTS=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/endpoints")
          HOST=$(echo "$ENDPOINTS" | jq -r '[.endpoints[] | select(.host | contains("pooler") | not)][0].host // .endpoints[0].host // ""')
          if [ -z "$HOST" ]; then
            echo "::error::Aucun endpoint Neon trouvé sur la branche $BRANCH_ID."
            exit 1
          fi
          MDP_REPONSE=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "$AUTH" -H "Accept: application/json" \
            -w '\n%{http_code}' \
            "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/roles/${ROLE}/reveal-password")
          CODE_MDP=$(echo "$MDP_REPONSE" | tail -n1)
          if [ "$CODE_MDP" != "200" ]; then
            echo "::error::reveal-password → HTTP $CODE_MDP. Réponse :"
            echo "$MDP_REPONSE" | head -n -1 | head -c 300
            echo ""
            echo "::error::Si la clé n'a pas le droit « reveal password », ajoutez un secret GitHub DATABASE_URL (postgresql://…/neondb?sslmode=require) et remplacez l'étape « Récupérer l'URL » par : DATABASE_URL=${DATABASE_URL:-}."
            exit 1
          fi
          MDP=$(echo "$MDP_REPONSE" | head -n -1 | jq -r '.password')
          if [ -z "$MDP" ] || [ "$MDP" = "null" ]; then
            echo "::error::Le mot de passe du rôle ${ROLE} n'a pas été renvoyé."
            exit 1
          fi
          echo "::add-mask::$MDP"
          URI="postgresql://${ROLE}:${MDP}@${HOST}/${BASE}?sslmode=require"
          echo "::add-mask::$URI"
          echo "DATABASE_URL=$URI" >> "$GITHUB_ENV"
          echo "URL de connexion construite et masquée (connexion directe, host : ${HOST})."

      - name: Adoption de la chaîne (première exécution, base db push)
        if: ${{ inputs.adopter_existant == true }}
        env:
          MIGRATIONS_A_APPLIQUER: "20260916120000_email_contact_principal"
        run: |
          set -euo pipefail
          # Toutes les migrations SAUF la plus récente sont DÉJÀ matérialisées
          # dans la base (historique `db push`) : on les enregistre comme
          # appliquées sans rejouer leur SQL. La plus récente reste en attente
          # et sera réellement appliquée par `migrate deploy` ci-dessous.
          for d in prisma/migrations/*/ ; do
            M=$(basename "$d")
            [ "$M" = "migration_lock.toml" ] && continue
            if [ "$M" = "$MIGRATIONS_A_APPLIQUER" ]; then
              echo "→ $M : laissée EN ATTENTE (appliquée réellement par migrate deploy)."
              continue
            fi
            echo "→ $M : enregistrement comme déjà appliquée."
            npx prisma migrate resolve --applied "$M" 2>&1 | grep -v '^$' || \
              echo "   (déjà enregistrée — ignoré)"
          done

      - name: Appliquer les migrations en attente
        run: npx prisma migrate deploy

      - name: État final des migrations
        run: npx prisma migrate status

      - name: Synthèse
        if: always()
        run: |
          echo "Rappel :"
          echo "• Première exécution → cocher « adopter_existant »."
          echo "• Exécutions suivantes → laisser décoché (deploy standard)."
          echo "• Une fois ce workflow vert, recharger l'application : les listes"
          echo "  Prestataires / Sociétés / Service Technique / Utilisateurs fonctionnent."
