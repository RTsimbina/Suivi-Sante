# ─────────────────────────────────────────────────────────────────────────────
# Diagnostic authentification Neon (lecture seule, aucun secret affiché)
# ─────────────────────────────────────────────────────────────────────────────
# Objectif : trancher pourquoi le mot de passe propagé par la rotation est
# rejeté par la base (« password authentication failed ») :
#   1. Les OPÉRATIONS Neon récentes : le reset a-t-il été appliqué (finished)
#      ou a-t-il échoué/resté pending ?
#   2. Le RÔLE neondb_owner : updated_at (dernière modification du mot de passe)
#   3. Tests SQL RÉELS avec le secret DATABASE_URL : direct et pooled.
# Le mot de passe n'est JAMAIS affiché (psql ne l'imprime pas dans ses erreurs ;
# l'URI est masquée par GitHub Actions car issue d'un secret).
# ─────────────────────────────────────────────────────────────────────────────

name: Diagnostic authentification Neon

on:
  workflow_dispatch:

permissions: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: green-moon-61901921
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Installer le client PostgreSQL
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          psql --version

      - name: Opérations Neon récentes et état du rôle
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2"
          AUTH="Authorization: Bearer ${NEON_API_KEY}"
          echo "── 15 dernières opérations du projet (id | action | état | date) :"
          curl -sS -H "$AUTH" \
            "$API/projects/${NEON_PROJECT_ID}/operations?limit=15" \
            | jq -r '.operations[] | "\(.id) | \(.action) | \(.status) | \(.created_at) | br=\(.branch_id // "?")"' || true
          BRANCH=$(curl -sS -H "$AUTH" \
            "$API/projects/${NEON_PROJECT_ID}/branches" \
            | jq -r '.branches[] | select(.default==true) | .id')
          echo "── Branche par défaut : ${BRANCH}"
          echo "── Rôle neondb_owner (métadonnées, mot de passe jamais retourné) :"
          curl -sS -H "$AUTH" \
            "$API/projects/${NEON_PROJECT_ID}/branches/${BRANCH}/roles/neondb_owner" \
            | jq -r '.role | "name=\(.name) | created_at=\(.created_at) | updated_at=\(.updated_at)"' || true

      - name: Endpoints et branches (mapping hôte → branche, sans secrets)
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2"
          AUTH="Authorization: Bearer ${NEON_API_KEY}"
          echo "── Branches du projet :"
          curl -sS -H "$AUTH" "$API/projects/${NEON_PROJECT_ID}/branches" \
            | jq -r '.branches[] | "id=\(.id) | primary=\(.primary // false) | default=\(.default // false) | \(.name)"' || true
          echo "── Endpoints (hôte | branche | statut) :"
          curl -sS -H "$AUTH" "$API/projects/${NEON_PROJECT_ID}/endpoints" \
            | jq -r '.endpoints[] | "\(.host // .id) | br=\(.branch_id) | \(.status)"' || true

      - name: À quel projet appartient l'endpoint de production ?
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2"
          AUTH="Authorization: Bearer ${NEON_API_KEY}"
          HOST=$(python3 -c "import os,urllib.parse; print(urllib.parse.urlsplit(os.environ['DATABASE_URL']).hostname)")
          echo "Endpoint de production recherché : ${HOST%%.*}.*"
          for PROJ in green-moon-61901901 green-moon-61901921; do
            echo "── Endpoints du projet ${PROJ} :"
            curl -sS -H "$AUTH" "$API/projects/${PROJ}/endpoints" 2>/dev/null \
              | jq -r '.endpoints[] | "  \(.host) | br=\(.branch_id) | \(.status)"' 2>/dev/null \
              || echo "  (inaccessible avec cette clé API)"
          done
          echo "── Lecture : l'endpoint ${HOST%%.*}.* doit apparaître sous UN de ces projets."

      - name: Discrimination mot de passe (brut vs encodé, jamais affichés)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          # Décompose l'URI du secret : les mots de passe transitent UNIQUEMENT par env.
          export RAWPASS=$(DATABASE_URL="$DATABASE_URL" python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DATABASE_URL"])
          print(urllib.parse.unquote(u.password or ""))
          PY
          )
          export STOREDPASS=$(DATABASE_URL="$DATABASE_URL" python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DATABASE_URL"])
          print(u.password or "")
          PY
          )
          HOST=$(DATABASE_URL="$DATABASE_URL" python3 -c "import os,urllib.parse; print(urllib.parse.urlsplit(os.environ['DATABASE_URL']).hostname)")
          USER=$(DATABASE_URL="$DATABASE_URL" python3 -c "import os,urllib.parse; print(urllib.parse.urlsplit(os.environ['DATABASE_URL']).username)")
          echo "── Test A : mot de passe BRUT (décodé depuis le secret) :"
          PGPASSWORD="$RAWPASS" psql -h "$HOST" -U "$USER" -d neondb -t -c "SELECT 'A OK — ' || current_user" 2>&1 | tail -2 || true
          echo "── Test B : mot de passe encodé tel quel dans le secret :"
          PGPASSWORD="$STOREDPASS" psql -h "$HOST" -U "$USER" -d neondb -t -c "SELECT 'B OK — ' || current_user" 2>&1 | tail -2 || true
          echo "── Lecture : A OK = problème d'encodage URI ; A KO partout = mot de passe du mauvais rôle/branche."
