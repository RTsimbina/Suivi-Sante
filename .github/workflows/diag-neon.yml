# ─────────────────────────────────────────────────────────────────────────────
# Diagnostic Neon — projets, endpoints, rôle propriétaire, tests SQL réels
# ─────────────────────────────────────────────────────────────────────────────
# Outil d'exploitation pour les incidents de connexion production.
# Toute la logique vit dans scripts/neon-diag.mjs (jamais de secret affiché).
#
# Secrets requis : NEON_API_KEY, DATABASE_URL
# Lancer : Actions → « Diagnostic Neon » → Run workflow.
# ─────────────────────────────────────────────────────────────────────────────
name: Diagnostic Neon

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-neon
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: spring-mud-40589280
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer le client PostgreSQL
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client >/dev/null
          psql --version

      - name: Diagnostic complet (projets, endpoints, rôle, tests SQL)
        run: node scripts/neon-diag.mjs
